<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary | Explore Guiuan</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<section class="itinerary-wrapper">

  <!-- CENTERED PILL GROUP (Airbnb-style) -->
  <div class="pill-group">

    <!-- ADVENTURE -->
    <div class="pill-container">
      <button class="pill-btn" onclick="toggleDropdown('adventureDrop')">
        <span class="pill-title">Adventure</span>
        <span class="pill-sub" id="adventureSummary">Choose experiences</span>
      </button>

      <div id="adventureDrop" class="dropdown">
        <!-- (UNCHANGED CONTENT) -->
      </div>
    </div>

    <!-- DAYS -->
    <div class="pill-container">
      <button class="pill-btn" onclick="toggleDropdown('daysDrop')">
        <span class="pill-title">Days</span>
        <span class="pill-sub" id="daysSummary">Select dates</span>
      </button>

      <div class="dropdown calendar-soft" id="daysDrop">
        <!-- (UNCHANGED CONTENT) -->
      </div>
    </div>

    <!-- GUESTS -->
    <div class="pill-container">
      <button class="pill-btn" onclick="toggleDropdown('guestsDrop')">
        <span class="pill-title">Guests</span>
        <span class="pill-sub" id="guestSummary">Add guests</span>
      </button>

      <div class="dropdown" id="guestsDrop">
        <!-- (UNCHANGED CONTENT) -->
      </div>
    </div>

  </div> <!-- END pill-group -->

  <!-- ESTIMATED COST (bottom-right) -->
  <div class="price-panel">
    <h3>Estimated Cost</h3>
    <p class="price" id="totalPrice">₱0</p>
    <p class="price-note">Prices vary by season, weather, and availability.</p>
    <p class="estimate-note">
      This is an estimate only. Final pricing may vary based on season, weather, group size, and availability.
    </p>
  </div>

</section>

<p class="itinerary-disclaimer">
Build Your Free-Flow Adventure. Choose what feels right for you. Everything is optional.
</p>

<script src="js/itinerary.js"></script>
</body>
</html>
